/* ---------- palettes (A = brand clay, B = porcelain, C = gold on night) ---------- */

  const P = PAL[p];
  if (p === 'C') {

/* ---------- geometry helpers ---------- */

function archShape(W, ys, H, x0 = -W / 2) {
  // pointed arch: two arcs centred on the springline (r = (W^2/4 + H^2) / W)
  const r = (W * W / 4 + H * H) / W, x1 = x0 + W, mid = x0 + W / 2;

  s.moveTo(x0, 0); s.lineTo(x0, ys);

  s.absarc(x1 - r, ys, r, Math.atan2(H, mid - (x1 - r)), 0, true);
  s.lineTo(x1, 0); s.lineTo(x0, 0);
  return s;
}
function archPath(W, ys, H, x0 = -W / 2) {

  const p = new THREE.Path();
  p.moveTo(x0, 0); p.lineTo(x0, ys);
  p.absarc(x0 + r, ys, r, Math.PI, Math.atan2(H, mid - (x0 + r)), true);
  p.absarc(x1 - r, ys, r, Math.atan2(H, mid - (x1 - r)), 0, true);
  p.lineTo(x1, 0); p.lineTo(x0, 0);
  return p;
}
function starShape(points, rOut, rIn) {

}

  const x = (R * R - r * r + d * d) / (2 * d), y = Math.sqrt(Math.max(0, R * R - x * x));

}

  // outer circle centre (0,0) radius R, inner circle centre (off,0.1) radius r2
  const s = new THREE.Shape();
  const cx = off, cy = 0.12;
  // intersection angles approximated by sampling
  const inside = (x, y) => (x - cx) ** 2 + (y - cy) ** 2 < r2 * r2;
  const outer = [], inner = [];
  for (let i = 0; i <= 720; i++) {
    const a = (i / 720) * Math.PI * 2;
    const x = Math.cos(a) * R, y = Math.sin(a) * R;
    if (!inside(x, y)) outer.push([x, y, a]);

  outer.sort((p, q) => ((p[2] + Math.PI) % (2 * Math.PI)) - ((q[2] + Math.PI) % (2 * Math.PI)));
  for (let i = 0; i <= 720; i++) {

/* Trim transparent margins, downscale in halving steps, return a WebP data URL. */
function exportWebp(maxW, maxH, quality = 0.9) {
  const w = canvas.width, h = canvas.height;
  const full = document.createElement('canvas'); full.width = w; full.height = h;
  const fg = full.getContext('2d'); fg.drawImage(canvas, 0, 0);
  const d = fg.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (d[(y * w + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  const pad = 4;
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
  let cur = document.createElement('canvas'); cur.width = x1 - x0 + 1; cur.height = y1 - y0 + 1;
  cur.getContext('2d').drawImage(full, x0, y0, cur.width, cur.height, 0, 0, cur.width, cur.height);
  const k = Math.min(1, maxW / cur.width, maxH / cur.height);
  const tw = Math.round(cur.width * k), th = Math.round(cur.height * k);
  while (cur.width / 2 >= tw && cur.height / 2 >= th) {
    const half = document.createElement('canvas'); half.width = Math.round(cur.width / 2); half.height = Math.round(cur.height / 2);
    const hg = half.getContext('2d'); hg.imageSmoothingQuality = 'high'; hg.drawImage(cur, 0, 0, half.width, half.height); cur = half;
  }
  const out = document.createElement('canvas'); out.width = tw; out.height = th;
  const og = out.getContext('2d'); og.imageSmoothingQuality = 'high'; og.drawImage(cur, 0, 0, tw, th);
  return { url: out.toDataURL('image/webp', quality), w: tw, h: th };
}

  renderer.render(scene, cam);
  window.__assets[name] = exportWebp(maxW, maxH, quality);
}
